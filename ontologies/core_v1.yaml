# ============================================================================
# OpenEvo — Shared Upper Ontology
# ============================================================================
# Path:      /ontologies/core_v1.yaml
# Authoring format: YAML (compiles to JSON-LD/RDF via a future /build/
#                    pipeline; do not hand-edit generated registry outputs)
#
# Namespace: All oe: prefixed IRIs resolve under the permanent identifier
# namespace https://www.w3id.org/openevo/ (via the w3id.org redirection
# service). oe:ClassName expands to https://www.w3id.org/openevo/ontology#ClassName.
#
# Relocation note (RFC-0001 of this repo, 2026-07-26): this file moved here
# from conceptbase/ontologies/core_v1.yaml unchanged in content — no class,
# property, or version number changed as part of the move. It previously
# lived inside conceptbase because conceptbase was, for a time, the only
# mature repo in the ecosystem; conceptbase's own README called this
# repo-hierarchy conflation out plainly ("OECB is the hub of a federated
# ecosystem"). It isn't one anymore: nine Foundational Repos share this
# ontology co-equally (ConceptBase owning Concept/LPM/Strand/LearningObject/
# Competency instances; CompetencyBase, TeachingBase, ProjectBase,
# LiteratureBase, HumanBase, TheoryBase, QuestionBase, and MethodsBase each
# owning their own classes as those are added), so the shared TBox now lives
# in a repo none of them owns. See this repo's GOVERNANCE.md and
# proposals/0001-shared-kernel-founding-and-migration.md for the full
# rationale, and conceptbase/proposals/0013-openevo-core-kernel-migration.md
# for conceptbase's own side of the same change.
#
# Scope: still Phase 1 in spirit (see conceptbase's Spec v0.4.0, "Phased
# Scope") — defines the TBox needed by the two Foundational Repos with real
# instance data today (ConceptBase's Concept/LPM/Strand/SubStrand/
# LearningObject/Competency). Classes for the other seven Foundational Repos
# (oe:Project, oe:Literature, oe:Person, oe:Group, TheoryBase's node-type
# family, oe:Question, oe:Method) and the promotion of oe:Resource are
# proposed separately, per repo, as this repo's own RFCs land — see
# `proposals/`. `reserved` below still marks their IRIs stable in the
# meantime, exactly as it did before the move.
# ============================================================================

id: OE-ONTOLOGY
version: 1.7.0
status: stable
authors:
  - name: OpenEvo Ecosystem Kernel Stewards (see GOVERNANCE.md)
license: CC-BY-NC-SA-4.0
phase: 1

"@context":
  oe:   "https://www.w3id.org/openevo/ontology#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl:  "http://www.w3.org/2002/07/owl#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  xsd:  "http://www.w3.org/2001/XMLSchema#"
  dct:  "http://purl.org/dc/terms/"

# ----------------------------------------------------------------------------
# CLASSES (Phase 1)
# ----------------------------------------------------------------------------
classes:

  oe:Entity:
    label: Entity
    status: stable
    abstract: true
    definition: >
      Abstract base class for every OpenEvo type, across every Foundational
      Repo. Not intended to be instantiated directly. Provides the common
      structural properties (identifier, status, version) that all concrete
      classes inherit, so new classes added by any Foundational Repo's own
      RFC automatically gain consistent identifier/versioning semantics
      without re-declaring them.

  oe:Concept:
    label: Concept
    status: stable
    subClassOf: [oe:Entity, skos:Concept]
    definition: >
      A unit of shared meaning — a term, idea, process, or category —
      used to describe curriculum content. This class defines only the
      *type*; specific terms (e.g. "Natural Selection") are instances of
      oe:Concept populated by controlled vocabularies owned and versioned
      by ConceptBase (see conceptbase/vocabularies/), not defined in this
      ontology.
    notes: >
      Because oe:Concept subclasses skos:Concept, all standard SKOS
      relations (skos:broader, skos:narrower, skos:related,
      skos:closeMatch, skos:exactMatch) are available on every Concept
      instance without redefinition. Cross-vocabulary alignment records
      are reified separately in conceptbase/alignments/, not modeled as a
      direct ontology property, so each alignment can carry its own
      provenance (assertedBy, date, status).

  oe:LPM:
    label: Learning Progression Model
    status: stable
    subClassOf: oe:Entity
    definition: >
      A top-level, independently governed model describing how
      competencies, concepts, and strands develop across a span of
      learner development (e.g. K–12). An LPM is a structural container:
      it references, but does not itself contain, lesson content.
      Instances are owned by ConceptBase.
    notes: >
      An LPM references a gradeSchema and subjectSchema by ID rather than
      embedding them, so it remains independent of any single grade/subject
      system.

  oe:Strand:
    label: Strand
    status: stable
    subClassOf: oe:Entity
    definition: >
      A coherent thematic thread within an LPM (e.g. "Origins of
      Science"). Strands are recursively compositional via oe:SubStrand,
      up to a recommended maximum of two nested levels — enforced at
      validation time, not as an ontology restriction, so the depth limit
      can be relaxed later without a class-level breaking change.
      Instances are owned by ConceptBase.

  oe:SubStrand:
    label: Sub-strand
    status: stable
    subClassOf: oe:Strand
    definition: >
      A child Strand nested within a parent Strand. Modeled as a
      *subclass* of oe:Strand rather than a separate sibling type, so
      recursive nesting uses a single self-referential property
      (oe:hasSubStrand) instead of one class per nesting level.

  oe:LearningObject:
    label: Learning Object
    status: stable
    subClassOf: oe:Entity
    definition: >
      The smallest independently addressable unit of curriculum content
      referenced by a Strand or SubStrand (e.g. a lesson, activity, or
      simulation). This ontology defines the type and its structural
      properties only; actual content lives in external repositories
      (Collections, Strand repos, etc.), never in ConceptBase itself.

  oe:Competency:
    label: Competency
    status: stable
    subClassOf: oe:Entity
    definition: >
      A statement of what a learner should know or be able to do,
      profiled as an extension of the CASE (1EdTech) CFItem structure —
      not a novel structure. Instances are owned by ConceptBase; see
      conceptbase/proposals/0002-competency-case-profile.md and
      conceptbase/schemas/competency.schema.yaml for the full CFItem field
      mapping, identifier-bridging rule, and associationType-to-relation
      mapping table.

# ----------------------------------------------------------------------------
# CLASSES (TheoryBase, QuestionBase, MethodsBase, SpeciesBase)
# ----------------------------------------------------------------------------
# Backfilled 2026-08-23 (task-check): all four founding RFCs below were
# already `accepted` in GOVERNANCE.md's Foundational Repos table, but their
# classes were never actually added here — none of RFC-0002/0003/0004's own
# "Files affected" sections named this file (only RFC-0006's did), so the
# gap sat unnoticed across three prior acceptances. Purely additive
# (MINOR version bump, see below); instances, schemas, and ids in each
# owning repo are unchanged — this only mints the kernel-level class
# mapping, exactly as RFC-0006's own acceptance already did for SpeciesBase.
# Each entry mirrors oe:Competency's own minimal style: label + one
# definition paragraph + a pointer to the owning repo's real schema for the
# full field mapping, not a re-derivation of every field here.
#
# Two naming collisions surfaced while doing this, resolved 2026-08-23
# (Dustin, live session) rather than left flagged:
#   - oe:Evidence: RFC-0002 (TheoryBase) and a pre-existing `reserved`
#     entry (likely TeachingBase, xAPI-profiled) both proposed the bare
#     name for genuinely different things (scholarly support for a claim
#     vs. student performance data). Neither had real records. Renamed
#     both rather than pick a winner: oe:ResearchEvidence (TheoryBase,
#     below) and oe:AssessmentEvidence (TeachingBase, still reserved).
#   - oe:Context: RFC-0002 (TheoryBase, 0 records) and RFC-0006
#     (SpeciesBase, 3 real records) both proposed the bare name for two
#     domain-specific senses of the same underlying idea ("conditions a
#     claim/observation holds under"). Rather than pick a winner,
#     oe:Context is now an abstract shared parent with two subclasses:
#     oe:EcologicalContext (SpeciesBase) and oe:TheoreticalContext
#     (TheoryBase).

  oe:Theory:
    label: Theory
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A coherent explanatory framework, decomposable into Propositions and
      Assumptions, attributable to a person or group. Instances are owned
      by TheoryBase; see openevo-core/proposals/0002-theorybase-founding-
      ontology.md and theorybase/schema/theory-record.schema.json for the
      full field mapping.

  oe:Proposition:
    label: Proposition
    status: accepted
    subClassOf: oe:Entity
    definition: >
      An individual claim within a Theory, with an evidence-quality note.
      Instances are owned by TheoryBase; see openevo-core/proposals/0002-
      theorybase-founding-ontology.md and theorybase/schema/proposition-
      record.schema.json for the full field mapping.

  oe:Assumption:
    label: Assumption
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A foundational premise within a Theory, not itself empirically
      tested. Instances are owned by TheoryBase; see openevo-core/
      proposals/0002-theorybase-founding-ontology.md for the full field
      mapping.

  oe:ResearchEvidence:
    label: Research Evidence
    status: accepted
    subClassOf: oe:Entity
    definition: >
      An empirical study, dataset, or finding that supports or challenges a
      Proposition. Named oe:ResearchEvidence rather than RFC-0002's
      original "oe:Evidence" — renamed 2026-08-23 (Dustin, live session)
      to resolve a naming collision with the unrelated, also-unbuilt
      oe:AssessmentEvidence (xAPI-profiled student performance data,
      likely TeachingBase's; see reserved: below). Instances are owned by
      TheoryBase; see openevo-core/proposals/0002-theorybase-founding-
      ontology.md for the full field mapping (0 records today).

  oe:CompetingProposition:
    label: Competing Proposition
    status: accepted
    subClassOf: oe:Entity
    definition: >
      An explicitly modeled alternative claim contesting another
      Proposition on the same question. Instances are owned by TheoryBase;
      see openevo-core/proposals/0002-theorybase-founding-ontology.md for
      the full field mapping.

  oe:Misconception:
    label: Misconception
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A documented, empirically-observed incorrect student belief pattern
      — a student cognitive artifact, not a scholarly claim, so it does
      not reduce to CompetingProposition. Instances are owned by
      TheoryBase; see openevo-core/proposals/0002-theorybase-founding-
      ontology.md and theorybase/schema/misconception-record.schema.json
      for the full field mapping.

  oe:CrossDomainConstruct:
    label: Cross-Domain Construct
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A construct treated as domain-general, spanning e.g. biological,
      cultural, or computational instantiations. Instances are owned by
      TheoryBase; see openevo-core/proposals/0002-theorybase-founding-
      ontology.md and theorybase/schema/cross-domain-construct-record.
      schema.json for the full field mapping.

  oe:Mechanism:
    label: Mechanism
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A directed causal link between two constructs, carrying strength/
      evidence and a mandatory power-mediation note (who/what the
      mechanism's effect depends on, and how it may vary across
      populations/contexts). Instances are owned by TheoryBase; see
      openevo-core/proposals/0002-theorybase-founding-ontology.md for the
      full field mapping.

  oe:Hypothesis:
    label: Hypothesis
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A directly testable, falsifiable claim spanning one or more
      constructs, with a structured evidence assessment. Instances are
      owned by TheoryBase; see openevo-core/proposals/0002-theorybase-
      founding-ontology.md for the full field mapping.

  oe:DesignPrinciple:
    label: Design Principle
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A normative curricular recommendation derived from one or more
      Theories — the missing link between what a theory claims and what a
      curriculum does. Instances are owned by TheoryBase; see openevo-core/
      proposals/0002-theorybase-founding-ontology.md and theorybase/
      schema/design-principle-record.schema.json for the full field
      mapping.

  oe:CurriculumDecision:
    label: Curriculum Decision
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A concrete design choice, justified by a DesignPrinciple and grounded
      in a Theory, instantiated in a real ConceptBase Strand. Instances are
      owned by TheoryBase; see openevo-core/proposals/0002-theorybase-
      founding-ontology.md and theorybase/schema/curriculum-decision-
      record.schema.json for the full field mapping.

  oe:LearningDependency:
    label: Learning Dependency
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A theory-relative prerequisite/reinforcement claim among concepts —
      different Theories can imply different dependency graphs for the
      same concepts. Instances are owned by TheoryBase; see openevo-core/
      proposals/0002-theorybase-founding-ontology.md and theorybase/
      schema/learning-dependency-record.schema.json for the full field
      mapping.

  oe:Question:
    label: Question
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A representation of uncertainty itself — what experts do not yet
      know or actively disagree about — distinct from Theory's job of
      capturing what experts currently believe. Carries a questionType
      (empirical | design | theoretical | methodological | policy |
      implementation) and a seven-stage inquiry lifecycle. Instances are
      owned by QuestionBase; see openevo-core/proposals/0003-questionbase-
      founding-ontology.md and questionbase/schema/question-record.
      schema.json for the full field mapping.

  oe:Method:
    label: Method
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A research or pedagogical method, classed by a methodClass enum
      (pedagogical-practice | research-method) rather than split into
      separate classes — this resolves the ontology plan's original Open
      Decision 4 and retires oe:Practice (see the reserved block below;
      any content that would have used oe:Practice uses methodClass:
      pedagogical-practice here instead). Decomposable into ordered
      phases that can cycle back on themselves, with an explicit pointer
      to where it's actually implemented as running software. Instances
      are owned by MethodsBase; see openevo-core/proposals/0004-
      methodsbase-founding-ontology.md and methodsbase/schema/method-
      record.schema.json for the full field mapping.

  oe:Taxon:
    label: Taxon
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A stable, authority-independent handle for a lineage — carries no
      scientific name or rank of its own, those live on its linked
      TaxonomicConcept(s). Instances are owned by SpeciesBase; see
      openevo-core/proposals/0006-speciesbase-founding-ontology.md and
      SpeciesBase/ontology/core_v1.yaml (sb:Taxon) for the full field
      mapping.

  oe:TaxonomicConcept:
    label: Taxonomic Concept
    status: accepted
    subClassOf: oe:Entity
    definition: >
      One biodiversity authority's circumscription (rank, parent, external
      record) of a Taxon; Phase 1 populates exactly one (GBIF-anchored)
      per Taxon. Instances are owned by SpeciesBase; see openevo-core/
      proposals/0006-speciesbase-founding-ontology.md and SpeciesBase/
      ontology/core_v1.yaml (sb:TaxonomicConcept) for the full field
      mapping.

  oe:LexicalForm:
    label: Lexical Form
    status: accepted
    subClassOf: oe:Entity
    definition: >
      Either a scientific or vernacular name for a Taxon, distinguished by
      a term_type discriminator rather than split into two classes.
      Instances are owned by SpeciesBase; see openevo-core/proposals/0006-
      speciesbase-founding-ontology.md and SpeciesBase/ontology/
      core_v1.yaml (sb:LexicalForm) for the full field mapping.

  oe:CulturalCategory:
    label: Cultural / Educational Category
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A culturally or educationally meaningful category ("fish,"
      "Säugetier") mapped to one or more TaxonomicConcepts via an
      explicit, non-identity relation type. Instances are owned by
      SpeciesBase; see openevo-core/proposals/0006-speciesbase-founding-
      ontology.md and SpeciesBase/ontology/core_v1.yaml
      (sb:CulturalCategory) for the full field mapping.

  oe:Language:
    label: Language
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A lightweight controlled-vocabulary entry backing LexicalForm's
      language tagging — not a full linguistic ontology. Instances are
      owned by SpeciesBase; see openevo-core/proposals/0006-speciesbase-
      founding-ontology.md and SpeciesBase/ontology/core_v1.yaml
      (sb:Language) for the full field mapping.

  oe:Feature:
    label: Feature
    status: accepted
    subClassOf: oe:Entity
    definition: >
      An abstract characteristic, process, capacity, or behavioral
      pattern; bilingual (EN/DE) by construction, grounded in eva_buch's
      curated concept table. Instances are owned by SpeciesBase; see
      openevo-core/proposals/0006-speciesbase-founding-ontology.md and
      SpeciesBase/ontology/core_v1.yaml (sb:Feature) for the full field
      mapping.

  oe:FeatureExpression:
    label: Feature Expression
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A concrete manifestation of a Feature in a specific Taxon, holding
      an optional array of Explanation references. Instances are owned by
      SpeciesBase; see openevo-core/proposals/0006-speciesbase-founding-
      ontology.md and SpeciesBase/ontology/core_v1.yaml
      (sb:FeatureExpression) for the full field mapping.

  oe:Context:
    label: Context
    status: accepted
    abstract: true
    subClassOf: oe:Entity
    definition: >
      Abstract shared parent for "the conditions under which some claim,
      observation, or behavior holds." Introduced 2026-08-23 (Dustin,
      live session) to unify two independently-proposed senses that
      collided under the same bare name: SpeciesBase's ecological/
      behavioral sense (oe:EcologicalContext) and TheoryBase's
      theory-applicability sense (oe:TheoreticalContext). Not intended to
      be instantiated directly — see the two subclasses below.

  oe:EcologicalContext:
    label: Ecological Context
    status: accepted
    subClassOf: oe:Context
    definition: >
      A named, reusable ecological/social/developmental/population
      context a FeatureExpression holds under, promoted to a full class
      so the same Context can be referenced from multiple
      FeatureExpressions across different taxa. Renamed from RFC-0006's
      original "oe:Context" 2026-08-23 to become a subclass of the new
      shared oe:Context, resolving the collision with TheoryBase's sense
      below. Instances are owned by SpeciesBase; see openevo-core/
      proposals/0006-speciesbase-founding-ontology.md and SpeciesBase/
      ontology/core_v1.yaml (sb:Context) for the full field mapping (3
      real records; SpeciesBase's own sb:Context id/schema are unchanged
      by this rename — only the oe: kernel-level mapping moved).

  oe:TheoreticalContext:
    label: Theoretical Context
    status: accepted
    subClassOf: oe:Context
    definition: >
      Educational/cultural/developmental conditions under which a
      Proposition is expected to hold. Named oe:TheoreticalContext rather
      than RFC-0002's original "oe:Context" — renamed 2026-08-23 (Dustin,
      live session) to resolve the collision with SpeciesBase's
      oe:EcologicalContext above, and made a subclass of the new shared
      oe:Context since both are the same underlying idea applied to
      different domains. Instances are owned by TheoryBase; see
      openevo-core/proposals/0002-theorybase-founding-ontology.md for the
      full field mapping (0 records today).

  oe:Explanation:
    label: Explanation
    status: accepted
    subClassOf: oe:Entity
    definition: >
      A single claim answering one of the seven canonical Tinbergen-family
      questions about one FeatureExpression. Promoted to a full,
      independently addressable Entity (not an inline struct) so
      competing accounts of the same claim can exist as sibling instances
      rather than one field silently picking a winner. Instances are
      owned by SpeciesBase; see openevo-core/proposals/0006-speciesbase-
      founding-ontology.md and SpeciesBase/ontology/core_v1.yaml
      (sb:Explanation) for the full field mapping.

# ----------------------------------------------------------------------------
# CLASSES (Reserved — IRI stable, structure not yet defined)
# ----------------------------------------------------------------------------
# Declaring these now means dependent repositories can forward-reference
# the IRIs (under https://www.w3id.org/openevo/ontology#) without a future
# breaking change once each is fully specified. Promoting a class out of
# `reserved` into `classes` is a MINOR version bump (additive), not a
# MAJOR one, since no existing reference changes. Ownership below anticipates
# lab_manager/docs/design-notes/ecosystem-base-graph-project-architecture-
# and-ontology-plan.md §3.1 — recorded here so each class's eventual RFC
# can reference an already-agreed owner rather than re-deciding it.

reserved:
  - iri: oe:Collection
    plannedPhase: 3
    note: Container aggregating Strands/LPMs for a distributed collection repo.
  - iri: oe:Assessment
    plannedPhase: 4
    plannedOwner: TeachingBase
  - iri: oe:AssessmentEvidence
    plannedPhase: 4
    plannedOwner: TeachingBase
    note: >
      Renamed from oe:Evidence 2026-08-23 (Dustin, live session) to resolve
      a naming collision with TheoryBase's oe:ResearchEvidence (see
      classes: below) — both were reserved/proposed under the bare name
      "oe:Evidence" for genuinely different things (student performance
      data vs. scholarly support for a claim); renamed both rather than
      pick a winner, since neither had real records yet. To be profiled
      as an extension of xAPI statement structure.
  - iri: oe:Resource
    plannedPhase: 4
    plannedOwner: TeachingBase
    note: External/media asset attachable to a LearningObject (profiled from IEEE LOM / schema.org/LearningResource).

# ----------------------------------------------------------------------------
# DATATYPE PROPERTIES — inherited via oe:Entity
# ----------------------------------------------------------------------------
entityProperties:

  oe:identifier:
    label: identifier
    domain: oe:Entity
    range: xsd:string
    status: stable
    definition: >
      The permanent OpenEvo identifier (e.g. OE-CONCEPT-oe-interdisciplinary-selection). Never
      changes once assigned, independent of label or definition changes.
      Resolvable via the owning Foundational Repo's registry, e.g.
      https://www.w3id.org/openevo/concept/000213.

  oe:status:
    label: status
    domain: oe:Entity
    range: xsd:string
    status: stable
    definition: >
      Lifecycle state of this entity: proposed | accepted | stable |
      deprecated | superseded | retracted. `retracted` is a parallel
      terminal state to `deprecated`/`superseded`, not sequential after
      it — it means the entity was accepted in error or is no longer
      endorsed, with no implied replacement. See this repo's GOVERNANCE.md
      for the full lifecycle and deprecation policy (deprecated and
      retracted entities are never deleted). Sandbox-tier entries
      (`OE-SANDBOX-*` identifiers) use a separate, smaller status
      vocabulary and are exempt from this lifecycle by construction.

  oe:version:
    label: version
    domain: oe:Entity
    range: xsd:string
    status: stable
    definition: Semantic version (MAJOR.MINOR.PATCH) of this entity.

  oe:producedBy:
    label: produced by
    domain: oe:Entity
    range: xsd:string
    status: accepted
    definition: >
      How this entity's content was actually generated: human | llm |
      human-llm-collaborative. Value space constrained at the schema layer
      (each owning repo's own schema/*.schema.json), not enumerated here —
      the same pattern already used for oe:status. human-llm-collaborative
      names live, human-attended drafting (a session where a person is
      actively present and steering), distinct from unattended/batch llm
      generation reviewed only afterward — the real distinction this RFC
      exists to make nameable, without requiring a separate mandatory
      field to record who was in the room (see RFC-0008 "Scope narrowed"
      for why that went further than warranted). Orthogonal to review
      status (TheoryBase's provenance.review_status, or any owning repo's
      equivalent): a record can be llm-produced and expert-validated, or
      human-produced and still author-draft. Also orthogonal to
      oe:epistemicStatus (RFC-0019, ConceptBase) — that field asks whether
      an LPM is a designed thought-experiment vs. field-validated
      curriculum; this field asks who/what drafted the content, at the
      level of any entity, not just LPMs. Accepted 2026-08-26 (RFC-0008,
      openevo-core-generation-provenance).

# ----------------------------------------------------------------------------
# OBJECT PROPERTIES (Phase 1)
# ----------------------------------------------------------------------------
properties:

  oe:hasStrand:
    label: has strand
    domain: oe:LPM
    range: oe:Strand
    status: stable
    definition: Relates an LPM to a top-level Strand it contains.

  oe:hasSubStrand:
    label: has sub-strand
    domain: oe:Strand
    range: oe:SubStrand
    status: stable
    definition: >
      Relates a Strand to a nested child Strand. Recursive composition
      is achieved via SubStrand's subclassing of Strand plus this single
      property, rather than one property per nesting depth.

  oe:partOfStrand:
    label: part of strand
    domain: oe:SubStrand
    range: oe:Strand
    status: stable
    inverseOf: oe:hasSubStrand
    definition: Inverse of oe:hasSubStrand, for traversal from child to parent.

  oe:hasLearningObject:
    label: has learning object
    domain: oe:Strand
    range: oe:LearningObject
    status: stable
    definition: Relates a Strand or SubStrand to a Learning Object it references.

  oe:hasConcept:
    label: has concept
    domain: [oe:Strand, oe:LearningObject]
    range: oe:Concept
    status: stable
    definition: >
      Declares that a Strand or Learning Object addresses a given
      Concept. This is the primary link between curriculum structure
      (owned by external repos) and the controlled vocabularies (owned
      by ConceptBase).

  oe:required:
    label: required
    domain: oe:SubStrand
    range: xsd:boolean
    status: stable
    definition: >
      Whether this SubStrand is obligate (true) or optional/elective
      (false) within its parent Strand's progression — supports Core
      Path / Elective Path / Regional Extension / Teacher Choice
      modeling within a single LPM.

  oe:recommendedSequence:
    label: recommended sequence
    domain: oe:Strand
    range: oe:Strand
    status: stable
    definition: Suggested default ordering between sibling Strands/SubStrands.

  oe:alternativeSequence:
    label: alternative sequence
    domain: oe:Strand
    range: oe:Strand
    status: stable
    definition: A valid, non-default ordering between sibling Strands/SubStrands.

  oe:parallel:
    label: parallel with
    domain: oe:Strand
    range: oe:Strand
    status: stable
    symmetric: true
    definition: Declares that two Strands/SubStrands may be taught concurrently.

  oe:prerequisiteOf:
    label: prerequisite of
    domain: oe:Strand
    range: oe:Strand
    status: stable
    definition: Declares that one Strand/SubStrand must precede another.

  oe:foundationalTo:
    label: foundational to
    domain: oe:Strand
    range: oe:Strand
    status: stable
    definition: >
      Declares that the source Strand/SubStrand should be introduced
      before the target, but — unlike oe:prerequisiteOf — is itself
      expected to be revisited and reinforced alongside the target
      rather than completed and gated behind before the target begins.
      Models a spiral-curriculum relationship, distinct from both a hard
      prerequisite gate (oe:prerequisiteOf) and fully concurrent,
      order-independent teaching (oe:parallel, which is symmetric; this
      relation is not).

  oe:definedInVocabulary:
    label: defined in vocabulary
    domain: oe:Concept
    range: xsd:string
    status: stable
    definition: >
      References the controlled vocabulary ID (e.g. BIO-CORE-v1.0.0) in
      which this Concept instance is defined. A Concept may be defined
      in exactly one home vocabulary but aligned to concepts in others
      via conceptbase/alignments/.

  oe:contextAssumption:
    label: context assumption
    domain: oe:SubStrand
    range: xsd:string
    status: accepted
    definition: >
      Names an explicit assumption about instructional context this
      SubStrand body is designed for. Value space
      (rich-scaffolding | minimal-prior-exposure) is constrained at the
      schema layer (conceptbase/schemas/common.defs.yaml#/$defs/contextAssumption),
      not enumerated here — the same pattern already used for oe:status.

  oe:hasTrajectoryVariant:
    label: has trajectory variant
    domain: oe:SubStrand
    range: oe:SubStrand
    status: accepted
    definition: >
      Relates a SubStrand to an alternate SubStrand body occupying the
      same conceptual slot, tagged with a different oe:contextAssumption.
      Deliberately NOT a subproperty of oe:hasSubStrand: this is
      alternation between coequal realizations of one slot, not
      parent-child composition.

  oe:forkedFrom:
    label: forked from
    domain: oe:LPM
    range: oe:LPM
    status: accepted
    definition: >
      Relates an LPM to the LPM it began as a fork of. Provenance only —
      does not imply the fork is a subset, a strict revision, or in any
      way subordinate; a fork is exactly as internally valid as its
      parent, the same non-hierarchical relationship BIO-CORE and
      OE-INTERDISCIPLINARY already have to each other, just made
      discoverable via an explicit lineage pointer instead of left
      implicit.

  oe:mergedInto:
    label: merged into
    domain: oe:LPM
    range: oe:LPM
    status: accepted
    definition: >
      Relates a sandbox-tier LPM being archived to the LPM its content
      was substantively absorbed into. Not used on permanent-tier LPMs —
      see the status: deprecated / supersededBy pattern for that case.
      Scoped to the sandbox tier, where archival rather than formal
      deprecation is the operative lifecycle event.

