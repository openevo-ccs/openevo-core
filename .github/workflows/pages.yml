name: Deploy OpenEvo Core landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "design-system/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble site (app/ + design-system/)
        run: |
          mkdir -p _site/design-system
          cp -r app/. _site/
          cp -r design-system/. _site/design-system/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
