# ============================================================================
# Path: /registry/retired-ids.yaml
# ============================================================================
# One machine-readable list of OpenEvo ids that no longer exist under that
# spelling, and where each one went. Built so that a reference to an old id
# can be followed instead of reported as broken (the lab's nightly reference
# check reads this file from the published main branch). See GOVERNANCE.md,
# "Retired and renamed ids".
#
# AI DRAFT. Claude Code compiled this table on 2026-10-31 from the sources
# named in each entry. No expert and no second person has reviewed it. Each
# entry says whether the source names the pair outright (named-in-source) or
# whether the pair follows from the source's numbering (derived-from-source).
#
# Statuses:
#   aliased  the old id was replaced by `successor`, which is an id of its own
#   moved    the id is unchanged, but its record now lives where the nightly
#            check does not read. OpenLPM keeps it in a database.
#   retired  the id has no successor (none yet; reserved for later entries)
#
# Add an entry only when a primary source names the old id and its fate.
# Never guess a successor.
# ============================================================================

